    <script>
        // Conditional Statement

        // 2. if else Statement

        // 3. Ladder if else Statement 


        // let age = 20;

        // else if (age < 18) {
        //     console.log("You can't Vote");

        // else {

        // 4. Nested if else Statement 


        let age = 18;

        if (age > 18) {
            console.log("You can Vote");

        }
        else {
            if (age < 18) {
                console.log("You can't Vote");
            }
            else {
                console.log("Make your Voter ID card");
            }
        }


        // 5. Switch case 


        let num = 4;

        switch (num) {
            case 1:
                console.log("One");
                break;
            case 2:
                console.log("Two");
                break;
            case 3:
                console.log("Three");
                break;
            default:
                console.log("Type 1, 2, 3");
                break;
        }



    </script>
