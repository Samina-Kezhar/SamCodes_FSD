<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>



    <!-- Bootstrap CSS  -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <input type="text" id="userName" placeholder="Enter your Name" onblur="validateUsername()">
    <span id="error1"></span>
    <br><br />
    <input type="password" id="userPassword" placeholder="Enter your Password" onblur="validateUserPassword()">
    <span id="error2"></span>
    <br><br />
    <input type="email" id="userEmail" placeholder="Enter your Email" onblur="validateUserEmail()">
    <span id="error3"></span>
    <br><br />
    <input type="text" id="userCity" placeholder="Enter your City" onblur="validateUserCity()">
    <span id="error4"></span>



    <script>


        let userName = document.getElementById("userName");
        let userPassword = document.getElementById("userPassword");
        let userEmail = document.getElementById("userEmail");
        let userCity = document.getElementById("userCity");

        function validateUsername() {
            console.log(userName.value)
            if (userName.value == "") {
                document.getElementById("error1").innerText = "Enter Your Name"
                document.getElementById("error1").style.color = "red"
            } else {
                document.getElementById("error1").innerText = ""
            }
        }
        function validateUserPassword() {
            console.log(userPassword.value)
            if (userPassword.value == "") {
                document.getElementById("error2").innerText = "Enter Your Password"
                document.getElementById("error2").style.color = "red"
            } else {
                document.getElementById("error2").innerText = ""
            }
        }
        function validateUserEmail() {
            console.log(userEmail.value)
            if (userEmail.value == "") {
                document.getElementById("error3").innerText = "Enter Your Email"
                document.getElementById("error3").style.color = "red"
            } else {
                document.getElementById("error3").innerText = ""
            }
        }
        function validateUserCity() {
            console.log(userCity.value)
            if (userCity.value == "") {
                document.getElementById("error4").innerText = "Enter Your City"
                document.getElementById("error4").style.color = "red"
            } else {
                document.getElementById("error4").innerText = ""
            }
        }
    </script>
</body>

</html>
