<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>



    <!-- Bootstrap CSS  -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <input type="text" id="userName" placeholder="Enter your Name" onblur="validate(this, 'error1' ,'Name')">
    <span id="error1"></span>
    <br><br />
    <input type="password" id="userPassword" placeholder="Enter your Password" onblur="validate(this,'error2', 'Password')">
    <span id="error2"></span>
    <br><br />
    <input type="email" id="userEmail" placeholder="Enter your Email" onblur="validate(this, 'error3', 'Email')">
    <span id="error3"></span>
    <br><br />
    <input type="text" id="userCity" placeholder="Enter your City" onblur="validate(this, 'error4', 'City')">
    <span id="error4"></span>



    <script>


        function validate(e, spnId, msg) {
            console.log(e.value)
            if (e.value == "") {
                // document.getElementById(spnId).innerText = "Enter Your " + msg
                document.getElementById(spnId).innerText = `Enter Your ${msg}`
                document.getElementById(spnId).style.color = "red"
            } else {
                document.getElementById(spnId).innerText = ""
            }
        }
      
    </script>
</body>

</html>
