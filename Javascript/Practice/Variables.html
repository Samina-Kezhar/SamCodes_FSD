<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables in JavaScript</title>
</head>

<body>
    <h1>Variables in JavaScript</h1>

    <p>In JavaScript, variables are used to store data values. You can declare a variable using the <code>var</code>,
        <code>let</code>, or <code>const</code> keywords.
    </p>

    <ul>
        <li>var = It was used before ES6 (ECMAScript 2015)</li>
        <li>let = Introduced in ES6, block-scoped</li>
        <li>const = Introduced in ES6, block-scoped and immutable</li>
    </ul>


    <script>
        // Variables In JavaScipt 

        // 1. var 
        // var a;            // variable declaration
        // name = "Rohan";   //  Assignement

        // var name = "Rohan";   // variable declaration and initialization
        // var name = "Rohan Kumar";   // Redeclaration is Possible
        // name = "Rohan gupta";   // Reassignment is Possible
        // console.log(name);
        // console.log(5+5);


        // 2. let 


        let num = 10;   // variable declaration and initialization
        // let num = 20;   // Redeclaration is Not Possible
        num = 30;   // Reassignment is Possible
        console.log(num);


        // 3. const


        const fav_Actor = "Shahrukh Khan";   // variable declaration and initialization
        // const fav_Actor = "Salman Khan";   // Redeclaration is Not Possible
        // fav_Actor = "Amitabh Bachchan";   // Reassignment is Not Possible
        console.log(fav_Actor);
    </script>

</body>

</html>
