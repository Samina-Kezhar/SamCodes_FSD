<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>


    <!-- bootstrap CSS  -->


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- Custom CSS  -->

    <style>
        li {
            list-style-position: inside;
            list-style: none;
           
        }
        body{ 
            background: url(todo_bg_1550.png);
        }
        .col{
            position: relative;
            top: 70px;
            left: 350px;
            width: 550px;
        }
        .Task{
            position: relative;
            left: 600px;
            bottom: 35px;
            background-color: rgb(220, 132, 132);
        }
        .update{
            position: relative;
            left: 600px;
            bottom: 5px;
            background-color: rgb(156, 81, 81);
        }
        .delete{
            position: relative;
            left: 750px;
            bottom: 45px;
            background-color: rgb(155, 80, 80);
        }
        #disp{
            position: relative;
            top: 50px;
            right: 240px;
            font-size: 23px;
            color: rgb(98, 61, 120);
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
       
    </style>
</head>

<body>

    <div class="col " id="box">

        <input type="text" name="" id="inpData" class="form-control">

        <button id="btn" class="btn Task " onclick="addTask()">ADD Task</button>

        <div id="disp" class=" border-3"></div>

    </div>

    <!-- bootstrap JS  -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    
        <!-- Custom JS  -->

    <script>
        let box = document.getElementById("box")
        let btn = document.getElementById("btn")
        let disp = document.getElementById("disp")
        let inpData = document.getElementById("inpData")

        // Empty Array - To Store Data 
        let arr = []


        // Add task 

        function addTask() {

            let todo = inpData.value
            arr.push(todo)
            displayTodo()

        }

        // Display Todo List 

        function displayTodo() {
            disp.innerHTML = ""
            arr.forEach((ele, i)=> {
                disp.innerHTML
                    += `
                        <div class="row d-flex justify-content-between">
                            <div class="col-8">
                                <li>${ele}</li>
                            </div>
                            <div class="col-4">
                                <button  class="btn btn-success update" onclick="updateTask(${i})">Update Task</button>
                                <button class="btn btn-danger delete" onclick="deleteTask(${i})">Delete Task</button>
                            </div>
                        </div>
                                    
                                    `
            });
        }

        // Delete Task 

        function deleteTask(i) {
            arr.splice(i, 1);
            displayTodo();
        }

        // Update Task 

        function updateTask(i) {
            let updatedTask = prompt("Enter updated task:", arr[i]);

            if (updatedTask !== null && updatedTask.trim() !== "") {
                arr[i] = updatedTask.trim();
                displayTodo();
            }
        }
    </script>

</body>

</html>
