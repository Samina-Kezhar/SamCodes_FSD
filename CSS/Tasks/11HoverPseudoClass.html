<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Pseudo Class</title>
    <style>
        button:hover{
            color: blueviolet;
            background-color: goldenrod;
        }
    </style>
</head>
<body>
    <button>Create</button>
    <br>
    <br>
    <button>Select</button>
    <br>
    <br>
    <button>Drop</button>
</body>
</html>
