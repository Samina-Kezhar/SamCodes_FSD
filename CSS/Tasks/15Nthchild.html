<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last-child</title>
    <style>
        li:nth-child(2){
            color:red;
                
        }
        li:nth-child(4){
            color:blue;
        }
        li:nth-child(6){
            color:green;
        }
    </style>
</head>
<body>
    <ul>
        <li>Item1</li>
        <li>Item2</li>
        <li>Item3</li>
        <li>Item4</li>
        <li>Item5</li>
        <li>Item6</li>
    </ul>
</body>
</html>
