<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: lightblue;
            border: 2px solid gray;
            text-align: center;
            margin: 5px;
            padding: 10px;
        }

        .inline div{
            display: inline;
            background-color: yellow;
            border: 2px solid gray;
            padding: 5px;
           
        }

        .block span{
            display: block;
             background-color: rgb(114, 114, 105);
            border: 2px solid rgb(208, 50, 50);
            padding: 5px;
             height: 50px;
        }

        .inline-block div{
            display: inline-block;
            background-color: rgb(172, 233, 190);
            border: 2px solid gray;
            padding: 5px;
        }

        .none p{
            display: none;
        }
    </style>
</head>
<body>
    <div class="inline box">
        <div class="inline1"></div>
        <div class="inline2"></div>
        <div class="inline3"></div>
    </div>

    <div class="block box">
        <span class="block1"></span>
        <span class="block2"></span>
        <span class="block3"></span>
    </div>

    <div class="inline-block box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>

    <div class="none box">
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ipsum quidem culpa laboriosam, rem omnis quis. Quaerat culpa ullam deserunt obcaecati qui ipsa autem praesentium dignissimos, veritatis omnis soluta sunt sint!</p>
    </div>
</body>
</html>
