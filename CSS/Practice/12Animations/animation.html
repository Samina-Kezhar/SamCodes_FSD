<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            position: relative;
            animation-name: example;
            width: 100px;
            height: 100px;
            background-color: maroon;
            animation-duration: 10s;
            animation-delay: 2s;
            animation-timing-function: ease-out;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
        }
        /* @keyframes example{
            from{
                background-color: maroon;
            }
            to{
                background-color: lightseagreen;
            }
        } */

        @keyframes example {
            0%{
                background-color: pink;
                left: 0px;
                
            }
            25%{
                background-color: rgb(196, 180, 242);
                left: 200px;
                top: 0px;
                border-radius: 20px;
                
            }
            50%{
                background-color: rgb(204, 206, 91);
                left: 200px;
                top: 200px;
                opacity: 0.1;
                border-radius: 50px;
              
            }
            75%{
                background-color: rgb(194, 89, 106);
                left: 0px;
                top: 200px;
                border-radius: 20px;
            }
            100%{
                background-color: pink;
                left: 0px;
                top: 0px;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
