<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin-top: 50px;
            height: 800px;
            border: 2px solid lightseagreen;
           
        }
        .container1{
            margin-top: 10px;
            height: 1000px;
            border: 2px solid rgb(215, 14, 115);
        }
        .test{
            margin-left: 20px;
            height: 100px;
            width: 100px;
            text-align: center;
            font-size: 30px;
        }
        #test1{
            background-color: aqua;
        }
        #test2{
            background-color: maroon;
            position: relative;
            top: 50px;
            left: 40px;
            z-index: 1;
        }
        #test3{
            background-color: rgb(222, 164, 17);
            position: absolute;
            top: 100px;
            right:0px;
        }
        #test4{
            background-color: rgb(223, 210, 178);
            position: fixed;
            top: 50px;
            right:0px;
        }
        #test5{
            background-color: rgb(79, 79, 168);
            position: sticky;
            top: 0px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test" id="test1">1</div>
        <div class="test" id="test2">2</div>
        <div class="test" id="test3">3</div>
        <div class="test" id="test4">4</div>
        <div class="test" id="test5">5</div>
    </div>
    <div class="container1">

    </div>
</body>
</html>
