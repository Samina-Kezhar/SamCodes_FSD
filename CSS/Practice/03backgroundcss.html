<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background CSS</title>
    <!-- Internal CSS  -->

    <style>
        div[class*="background"]{
            width: 100%;
            height: 400px;
            border: 5px dashed green;
            font-size: 30px;
            text-transform: capitalize;
            color: aliceblue;
        }
        .background-attachment{
            background-image: url(D:\ASDC\FSD\CSS\Top-Man.avif);
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        
            
        }
        .background-clip{
            background-image: url(D:\ASDC\FSD\CSS\Top-Man.avif);
            /* padding: 100px; */
            /* background-clip: border-box;
            background-clip: padding-box;
            background-clip: content-box;
             */
        }
        .background-color{
            background-color: antiquewhite;
            color: black !important;
            
        }
        .background-image{
            background-image: url(../../Images/bannere.jpg);
            
        }
        .background-origin{
            background-image: url(../../Images/bannere.jpg);
            background-repeat: no-repeat;
            padding: 100px;
            background-origin: border-box;
            background-origin: padding-box;
            background-origin: content-box;

            
        }
        .background-position{
            background-image: url(../../Images/bannere.jpg);
            background-repeat: no-repeat;
            /* background-size: cover; */
            background-position: center center;
            background-position: top;
            background-position: left;
            background-position: right;
            background-position: bottom;
            background-position: 50% 100px;
        }
        .background-repeat{
            background-image: url(../../Images/bannere.jpg);
            background-repeat: repeat-x;
            background-repeat: repeat-y;
            background-repeat: round;
            background-repeat: space;
            background-repeat: no-repeat;
            
        }
        .background-size{
            background-image: url(../../Images/bannere.jpg);
            background-repeat: no-repeat;
            background-size: auto;
            background-size: contain;
            background-size: cover;
            background-size: 100% 100%;

            
        }
        .shorthand-background{
            background: url(../../Images/bannere.jpg)center center/cover;
        }
    </style>
</head>
<body>
    <h1>Background CSS</h1>
    <hr>
    <div class="background-clip">background-clip</div>
    <br>
    <div class="background-color">background-color</div>
    <br>
    <div class="background-attachment">background-attachment</div>
    <br>
    <div class="background-image">background-image</div>
    <br>
    <div class="background-origin">background-origin</div>
    <br>
    <div class="background-position">background-position</div>
    <br>
    <div class="background-repeat">background-repeat</div>
    <br>
    <div class="background-size">background-size</div>
    <br>
    <div class="shorthand-background">shorthand-background  </div>
    <br>
</body>
</html>
