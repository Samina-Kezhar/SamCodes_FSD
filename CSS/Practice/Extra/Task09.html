<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle{
            position: relative;
            height: 100px;
            width: 100px;
            border-radius: 50px;
            background-image: conic-gradient(rgb(232, 146, 146),rgb(230, 230, 159),rgb(168, 168, 230),rgb(162, 229, 162));
            animation-name: move,rotate;
            animation-duration: 7s;
            animation-iteration-count: infinite;

        }
        @keyframes move {
            from{
                top: 0px;
                left: 0px;
            }
            to{
                top: 0px;
                left: 300px;
            }
        }
        @keyframes rotate {
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="circle"></div>
</body>
</html>
