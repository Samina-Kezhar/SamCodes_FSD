<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            transition: all 2s ease-out;
        }
        input:hover{
            background-color: lightblue;
            color: rgb(76, 2, 2);
            border: 5px double pink;
        }
        button{
            transition: all 2s ease-out;
        }
        button:hover{
            background-color: rgb(22, 147, 189);
            color: rgb(231, 223, 223);
            padding: 10px;
            border: 5px;
        }
    </style>
</head>
<body>
    <!-- Create an interactive html form that demostrates the use of css transition to enchance user experience
        when the user interacts with the form element; their input field should smothly change its background,text color,border style when hovered
        the button should smothly change its background,text color,padding,border tickness when hovered 
        the transition should be visually apealing and use easing for smooth motion -->


        <form action="" method="post">
            <input type="text" placeholder="Enter name">
            <button type="submit">Submit</button>
        </form>
</body>
</html>
