<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            position: relative;
            width: 350px;
            align-items: center;
            margin: 0 auto;
            border: 2px rgb(36, 36, 135)solid;
            border-radius: 10px;
            padding: 20px;
            background-image: linear-gradient(lightblue,whitesmoke);
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 24px;
            color: rgb(21, 56, 116);
            animation-name: updown;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        @keyframes updown {
            
            to{
                transform: translatey(20px);
            }
        }
        form:hover{
            box-shadow: 2px 3px 5px moccasin;
        }
        button{
            background-image: linear-gradient(rgb(227, 213, 215),rgb(117, 159, 186));
        }
        button:hover{
            background-image: linear-gradient(rgb(237, 184, 193),rgb(91, 130, 151));
        }
    </style>
</head>
<body>
    <form action="submit.html" method="post" >
       <br> <label for="name">Name:</label>
        <input type="text" placeholder="Enter name"><br><br>

        <label for="Email">Email:</label>
        <input type="email" placeholder="Enter email"><br><br>

        <label for="Password">Password:</label>
        <input type="password" placeholder="Enter password"><br><br>

        <label for="Gender">Gender:</label>
        <input type="radio" value="male" name="g">
        <label>Male</label>
        <input type="radio" value="female" name="g">
        <label>Female</label><br><br>

        <button type="submit">submit</button>
    </form>
</body>
</html>
