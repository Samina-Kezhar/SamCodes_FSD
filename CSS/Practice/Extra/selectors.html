<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul>li{
            font-size: 10px;
            color: red;
        }
        ul>b{
            font-size: 20px;
            color: rgb(72, 0, 255);
        }
    </style>
</head>
<body>
    <!-- Add ul with 3 list items
        if direct child of ul element is b then display text in blue color and size 20px 
        if direct child of ul is li then display in red color and text size 10px-->
        <ul>
            <li><b>sakina</b></li>
            <li><b>kaizar</b></li>
            <b><li>mustafa</li></b>
        </ul>
</body>
</html>
