<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text CSS</title>
    <style>
        
        h1{
            text-align:;
            /* start,end,left,right */
            text-decoration: underline;
            /* none,overline,linethrough,underline */
            color: blue;
            text-shadow: 10px 10px 50px green;
                      /*  h   v   blur  color */
            text-indent: 50px;
            word-spacing: 50px;
            letter-spacing: 10px;
            text-transform: capitalize;
            text-transform: uppercase;
            text-transform: lowercase;
        }
        a{
            text-decoration: none;

        }
    </style>
</head>
<body>

        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Rem accusamus perferendis provident? Autem odio ad tenetur perferendis reiciendis quam saepe qui porro nemo, obcaecati natus veritatis. Consequatur iure sit aliquam?
    </h1>
    <hr>
    <a href="">home</a>

</html>
