<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <table>
    <fieldset>
        <form action="" method="post" enctype="multipart/form-data">
            <label for="Roll No">Roll No:</label>
            <input type="number" name="Roll No">
            <br>
            <br>
            <label for="Student name">Student name:</label>
            <input type="text" name="name" id="name" placeholder="firstname">-
            <input type="text" name="name" id="name" placeholder="Lastname">
            <br>
            <br>
            <label for="Father's name">Father's name:</label>
            <input type="text" name="name" id="name">
            <br>
            <br>
            <label for="DoB">Date-of-Birth</label>
            <input type="number" name="day" placeholder="Day">-
            <input type="number" name="month" placeholder="Month">-
            <input type="number" name="year" placeholder="year">(DD/MM/YYYY)
            <br>
            <br>
            <label for="MobileNo">Mobile No:</label>
            <input type="tel" name="phone">
            
            <br>
            <br>
            <label for="email">Email Id:</label>
            <input type="email" name="email">
            <br>
            <br>
            <label for="Password">Password:</label>
            <input type="password" name="password">
            <br>
            <br>
            <label for="Gender">Gender:</label>  
            <input type="radio" name="gender" id="Male" value="Male">
            <label>Male</label>
            <input type="radio" name="gender" id="Female" value="FeMale">
            <label>Female</label>
            <br>
            <br> 
            <label>Department:</label>
            <input type="checkbox" name="Department" id="CSE" value="CSE">
            <label>CSE</label>
            <input type="checkbox" name="Department" id="IT" value="IT">
            <label>IT</label>
            <input type="checkbox" name="Department" id="ECE" value="ECE">
            <label>ECE</label>
            <input type="checkbox" name="Department" id="CIVIL" value="CIVIL">
            <label>CIVIL</label>
            <input type="checkbox" name="Department" id="MECH" value="MCEH">
            <label>MECH</label>
            <br>
            <br>
            <select>
            <label for="Course">Course:</label>
            <option value="select courses">----Select courses-----</option>
            <option value="Full-Stack">Full-stack</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Cyber security">Cyber security</option>
            </select>
            <br>
            <br>
            <label for="Student Photo">Student photo:</label>
            <input type="file" name="Student photo">
            <br>
            <br>
            <label>City:</label>
            <input type="text" name="city">
            <br>
            <br>
            <label>Address:</label>
            <textarea rows="7" cols="27" ></textarea>
            <br>
            <br>
            <br>
            <button type="submit">Register</button>

           



        </form>
    </fieldset>
    </table>
</body>
</html>
